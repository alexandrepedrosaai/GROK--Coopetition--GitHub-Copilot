# This workflow builds and pushes a Docker container to GitHub Container Registry (GHCR)
# and deploys it to an Azure Web App.
#
# Required secrets:
#   AZURE_CREDENTIALS - Service principal JSON for Azure login
#   AZURE_WEBAPP_PUBLISH_PROFILE - Publish profile XML (backup auth)
#
# Required variables:
#   AZURE_DEPLOY_ENABLED - Set to 'true' to enable Azure deployment
#
# For more information on GitHub Actions for Azure: https://github.com/Azure/Actions

name: Build and deploy a container to an Azure Web App

env:
  AZURE_WEBAPP_NAME: metagrok-mesh

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Lowercase the repo name and username
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}:${{ github.sha }}
            ghcr.io/${{ env.REPO }}:latest
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' }}
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Lowercase the repo name and username
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: 'ghcr.io/${{ env.REPO }}:${{ github.sha }}'
