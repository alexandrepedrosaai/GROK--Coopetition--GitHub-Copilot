# This workflow builds and pushes a Docker container to GitHub Container Registry (GHCR).
# When Azure credentials are configured, it also deploys to an Azure Web App.
#
# Setup for GHCR (works immediately):
#   - Docker image is built from Dockerfile and pushed to ghcr.io
#   - No additional configuration needed
#
# Setup for Azure deployment (optional):
#   1. Create an Azure Web App in the Azure Portal
#   2. Download the Publish Profile from the Azure Web App's Overview page
#   3. Create a repository secret named AZURE_WEBAPP_PUBLISH_PROFILE with the publish profile XML
#   4. Update AZURE_WEBAPP_NAME below to your actual Azure Web App name
#   5. Configure Azure Web App settings:
#       DOCKER_REGISTRY_SERVER_URL: https://ghcr.io
#       DOCKER_REGISTRY_SERVER_USERNAME: alexandrepedrosaai
#       DOCKER_REGISTRY_SERVER_PASSWORD: (GitHub PAT with read:packages)
#
# For more information on GitHub Actions for Azure: https://github.com/Azure/Actions

name: Build and deploy a container to an Azure Web App

env:
  AZURE_WEBAPP_NAME: grok-coopetition-mesh  # set this to the name of your Azure Web App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log in to GitHub container registry
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Lowercase the repo name and username
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Build and push container image to registry
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}:${{ github.sha }}
            ghcr.io/${{ env.REPO }}:latest
          file: ./Dockerfile

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' }}
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Lowercase the repo name and username
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'ghcr.io/${{ env.REPO }}:${{ github.sha }}'
